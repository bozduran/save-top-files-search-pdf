name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The sandbox this project was developed in had a read-only global npm cache.
  npm_config_cache: ${{ github.workspace }}/.npm-cache
  # Keep the browser download inside the checkout, same as local development.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest LTS supported by the extension engine; 26 matches
        # the environment the project was developed against.
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: .npm-cache
          key: npm-${{ runner.os }}-${{ matrix.node }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ matrix.node }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check imports and reachability
        run: npm run check:imports

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: .pw-browsers
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for layout checks
        run: npx playwright install --with-deps chromium

      - name: Unit, DOM and layout tests
        run: npm test

      - name: Smoke tests (bundled extension + PDF extraction)
        run: npm run smoke

      - name: Package extension
        if: matrix.node == '22'
        run: node scripts/package.mjs

      - name: Upload vsix
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: pdf-hub-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
